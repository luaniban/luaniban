name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#f0896b&color_dots=#eef0f4,#c3cde3,#8ea3cc,#4f6ea5,#22407a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f1c25e&color_dots=#161b22,#1c2b4d,#22407a,#3f64a8,#7a9bd6

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza a cobrinha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
